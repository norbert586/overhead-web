name: Update Changelog

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  update-changelog:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Append changelog entry
        env:
          PR_TITLE:  ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL:    ${{ github.event.pull_request.html_url }}
        run: node .github/scripts/update-changelog.mjs

      - name: Commit and push
        run: |
          if git diff --quiet -- CHANGELOG.md; then
            echo "No changelog change — skipping commit."
            exit 0
          fi
          git config user.name  "overhead-changelog-bot"
          git config user.email "overhead-changelog-bot@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "Update CHANGELOG for #${{ github.event.pull_request.number }}"
          git push origin main
