<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ECEEE6" />
    <!-- Pick the chart before first paint so a night launch never flashes the
         day theme. Mirrors src/hooks/useTheme.ts (same keys, same colours). -->
    <script>
      (function () {
        var t = 'light';
        try {
          var p = localStorage.getItem('overhead_theme') || 'device';
          if (p === 'light' || p === 'dark') t = p;
          else if (p === 'sun' && localStorage.getItem('overhead_theme_sun')) t = localStorage.getItem('overhead_theme_sun');
          else if (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) t = 'dark';
        } catch (e) { /* storage blocked: day chart */ }
        document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
        if (t === 'dark') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0F192C');
      })();
    </script>
    <meta name="description" content="Catch the flights overhead. Open the app when you hear one — it grabs your location and logs whatever is in the sky above you." />
    <title>Overhead</title>
    <!-- Link previews: shared catches end with this site's URL, and Messages,
         WhatsApp and Slack build the card from these (static HTML only — they
         don't run JS). og:image must be an absolute URL. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Overhead" />
    <meta property="og:title" content="Overhead — catch the planes flying over you" />
    <meta property="og:description" content="Hear a plane? Open Overhead and see the airline, the aircraft and where it's headed — then add it to your log." />
    <meta property="og:url" content="https://overheadflight.com/" />
    <meta property="og:image" content="https://overheadflight.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Overhead — catch the planes flying over you" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Photo + logo hosts: warm up the connections before the first aircraft renders -->
    <link rel="preconnect" href="https://api.planespotters.net" crossorigin />
    <link rel="preconnect" href="https://images.kiwi.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
